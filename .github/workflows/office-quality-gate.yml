name: FormatLab Offline Fidelity Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'qa/**'
      - '.github/workflows/office-quality-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'qa/**'
      - '.github/workflows/office-quality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-qa-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install local quality checker dependencies
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7 Pillow==12.0.0 python-docx==1.2.0

      - name: Source compile
        run: python -m py_compile qa/office_fidelity_probe.py qa/test_office_fidelity_probe.py

      - name: Public synthetic detector tests
        working-directory: qa
        run: python -m unittest -v test_office_fidelity_probe.py

      - name: Record evidence boundary
        run: |
          echo 'QUALITY_GATE_TESTS=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'These unit tests prove only that the quality detector catches structural failures.' >> "$GITHUB_STEP_SUMMARY"
          echo 'ANDROID_OFFICE_ENGINE=NOT_INTEGRATED' >> "$GITHUB_STEP_SUMMARY"
          echo 'DOCX_TO_PDF_PROFESSIONAL_FIDELITY=BLOCKED' >> "$GITHUB_STEP_SUMMARY"
