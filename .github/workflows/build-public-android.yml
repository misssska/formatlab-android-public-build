name: FormatLab Android v0.3 offline debug APK

on:
  push:
    branches: [main]
    paths:
      - 'FormatLab-Android-v0.3-offline-source.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formatlab-v03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4

      - name: Verify SHA-256 and safe archive structure
        shell: bash
        run: |
          set -euo pipefail
          echo '04694a0afbc26ebcbe7dd0c4c265d656acc05497d6d5765980c22e4366c0123b  FormatLab-Android-v0.3-offline-source.zip' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          f=Path('FormatLab-Android-v0.3-offline-source.zip')
          with zipfile.ZipFile(f) as z:
              entries=z.infolist()
              assert len(entries)==69, len(entries)
              assert sum(x.file_size for x in entries)<1_000_000
              assert all(x.filename.startswith('FormatLab-Android-v0.3/') and '..' not in x.filename.split('/') for x in entries)
              assert all(((x.external_attr >> 16)&0o170000)!=0o120000 for x in entries)
              assert z.testzip() is None
          print('ARCHIVE_AUDIT_PASS')
          PY
          unzip -q FormatLab-Android-v0.3-offline-source.zip

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 35 platform and build tools
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test offline permissions, JS formats, native bridge and source audit
        working-directory: FormatLab-Android-v0.3
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_public_source.py
          python3 scripts/verify_android.py
          python3 scripts/test_offline_surface.py
          node scripts/test_js_bridge.js
          node scripts/test_offline_algorithms.js

      - name: Build offline Android v0.3 debug APK
        working-directory: FormatLab-Android-v0.3
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Confirm nonempty APK file
        run: test -s FormatLab-Android-v0.3/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish debug APK as public GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK='FormatLab-Android-v0.3/app/build/outputs/apk/debug/app-debug.apk'
          TAG="formatlab-v0.3.0-debug-run-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK#FormatLab-Android-v0.3-debug.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "FormatLab Android v0.3.0 offline — debug test" \
            --notes "Offline-only debug build. APK uses native Android PDF/Word/AAC features with restricted fidelity. Source SHA-256 verified. Real handset tests required." \
            --prerelease
